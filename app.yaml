apiVersion: apps/v1
kind: Deployment
metadata:
  name: hca-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hca-app
  template:
    metadata:
      labels:
        app: hca-app
    spec:
      containers:
      - name: hca-app
        image: hca-website:v1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hca-app-service
spec:
  type: NodePort
  selector:
    app: hca-app
  ports:
    - port: 80
      targetPort: 80
